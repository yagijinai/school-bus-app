<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Bus Body -->
  <g transform="translate(36, 40)">
    <!-- Bus main frame -->
    <rect x="6" y="10" width="108" height="84" rx="18" fill="url(#busGrad)" />
    <!-- Bus roof cap -->
    <path d="M 18 10 Q 60 2 102 10" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    
    <!-- Windshield / Windows -->
    <rect x="16" y="20" width="40" height="28" rx="6" fill="url(#glassGrad)" />
    <rect x="64" y="20" width="40" height="28" rx="6" fill="url(#glassGrad)" />
    
    <!-- Front Grill / Sign -->
    <rect x="36" y="56" width="48" height="10" rx="3" fill="#0f172a" />
    <text x="60" y="64" fill="#fbbf24" font-size="7" font-weight="bold" text-anchor="middle" font-family="sans-serif">SCHOOL BUS</text>
    
    <!-- Headlights -->
    <circle cx="22" cy="74" r="6" fill="#fef08a" />
    <circle cx="22" cy="74" r="3" fill="#ffffff" />
    <circle cx="98" cy="74" r="6" fill="#fef08a" />
    <circle cx="98" cy="74" r="3" fill="#ffffff" />
    
    <!-- Bumper -->
    <rect x="12" y="86" width="96" height="8" rx="4" fill="#334155" />
    
    <!-- Wheels -->
    <circle cx="28" cy="98" r="14" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <circle cx="28" cy="98" r="5" fill="#94a3b8" />
    <circle cx="92" cy="98" r="14" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <circle cx="92" cy="98" r="5" fill="#94a3b8" />
  </g>
</svg>
